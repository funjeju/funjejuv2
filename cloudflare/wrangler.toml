name = "funjeju-cctv-proxy"
main = "worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV 네임스페이스: CCTV 원본 URL 저장소
# 배포 후 `wrangler kv:namespace create CCTV_ORIGINS` 로 id 발급
[[kv_namespaces]]
binding = "CCTV_ORIGINS"
id = "a2e7fee994e94d9f9a5f1972201fcbc3"

[vars]
# 콤마로 여러 도메인 허용 가능 (출처 가드용)
ALLOWED_ORIGIN = "https://funjeju.com,https://www.funjeju.com,https://funjejuv2.vercel.app"

# 체인 모드 — CCTV origin이 Cloudflare 엣지 IP를 차단(522)해서,
# 한국 고정 IP 프록시(Vultr 서울)를 origin으로 경유한다.
# 비우면 KV originUrl(진짜 CCTV) 직접 fetch로 원복.
ORIGIN_PROXY_BASE = "https://stream.funjeju.com"
ORIGIN_PROXY_KEY = "funjeju-chain-key-9271"

# 커스텀 도메인 — workers.dev 주소를 우리 도메인 뒤로 숨김.
# 클라이언트 video src가 stream.funjeju.com만 가리키게 됨 (Cloudflare 정체 은닉).
# 사전 준비: Cloudflare 대시보드 → Workers & Pages → 이 워커 → Settings → Domains & Routes
#   → "Add Custom Domain" → stream.funjeju.com (DNS 레코드 자동 생성됨)
# 그 후 아래 주석을 풀고 `wrangler deploy` 하면 라우트가 반영됩니다.
# [[routes]]
# pattern = "stream.funjeju.com"
# custom_domain = true
